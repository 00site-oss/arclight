<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Arclight — Earn Station</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b12;
      --bg-elevated: #0d1420;
      --bg-card: #111a28;
      --bg-hover: #162033;
      --border: #1e2d42;
      --border-strong: #2a3f5c;
      --text: #e8eef6;
      --text-muted: #8b9cb3;
      --text-dim: #5a6d85;
      --accent: #f0a030;
      --accent-dim: #c47e18;
      --accent-glow: rgba(240, 160, 48, 0.15);
      --success: #3ecf8e;
      --danger: #e85d5d;
      --info: #5b9fd4;
      --radius: 10px;
      --radius-sm: 6px;
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { display: grid; grid-template-columns: 72px 1fr; min-height: 100vh; }
    .rail {
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0; gap: 6px; position: sticky; top: 0; height: 100vh; z-index: 50;
    }
    .rail-logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dim));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #0a0a0a; margin-bottom: 20px; flex-shrink: 0;
    }
    .rail-btn {
      width: 44px; height: 44px; border: none; background: transparent; color: var(--text-dim);
      border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; flex-shrink: 0;
    }
    .rail-btn:hover { background: var(--bg-hover); color: var(--text); }
    .rail-btn.active { background: var(--accent-glow); color: var(--accent); }
    .rail-btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
    .rail-btn .rail-label { display: none; }
    .rail-spacer { flex: 1; }
    .main-col { display: flex; flex-direction: column; min-width: 0; overflow-x: hidden; }
    .topbar {
      height: 56px; border-bottom: 1px solid var(--border); background: var(--bg-elevated);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
      position: sticky; top: 0; z-index: 40;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .page-label { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .balance-chip {
      display: flex; align-items: center; gap: 8px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px 6px 8px;
    }
    .balance-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .balance-chip .amt { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--success); }
    .balance-chip .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    .balance-chip.hold .dot { background: var(--accent); }
    .balance-chip.hold .amt { color: var(--accent); }
    .avatar-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-strong);
      background: var(--bg-card); color: var(--accent); font-weight: 700; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .mobile-bar { display: none; align-items: center; gap: 8px; }
    .mobile-menu-btn {
      width: 36px; height: 36px; border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-muted); border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .content { padding: 28px 32px 48px; max-width: 1100px; width: 100%; margin: 0 auto; }
    @media (max-width: 640px) { .content { padding: 16px 14px 40px; } }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .rail {
        display: none; flex-direction: column; align-items: stretch; padding: 16px 12px;
        width: 240px; background: var(--bg-elevated); border-right: 1px solid var(--border);
      }
      .rail.mobile-open {
        display: flex; position: fixed; inset: 0 auto 0 0; z-index: 100; height: 100vh;
        box-shadow: 8px 0 32px rgba(0,0,0,0.5);
      }
      .rail.mobile-open .rail-btn { width: 100%; justify-content: flex-start; gap: 12px; padding: 0 14px; height: 44px; }
      .rail.mobile-open .rail-btn .rail-label { display: inline; font-size: 13px; font-weight: 500; }
      .rail.mobile-open .rail-logo { margin-left: 8px; margin-bottom: 16px; }
      .mobile-bar { display: flex !important; }
      .topbar { padding: 0 12px 0 8px; }
      .balance-chip .lbl { display: none; }
    }
    .landing {
      min-height: 100vh; display: flex; flex-direction: column;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(240, 160, 48, 0.12), transparent), var(--bg);
    }
    .landing-nav {
      display: flex; align-items: center; justify-content: space-between; padding: 20px 40px;
      max-width: 1100px; margin: 0 auto; width: 100%;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dim));
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0a0a0a;
    }
    .landing-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px;
      border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer;
      border: 1px solid transparent; transition: background 0.15s, border-color 0.15s, transform 0.1s; white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
    .btn-primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
    .btn-primary:hover { background: #f5b04a; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-block { width: 100%; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-danger { background: transparent; border-color: rgba(232, 93, 93, 0.4); color: var(--danger); }
    .btn-danger:hover { background: rgba(232, 93, 93, 0.1); }
    .hero {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px 80px; max-width: 720px; margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
      background: var(--accent-glow); border: 1px solid rgba(240, 160, 48, 0.3);
      color: var(--accent); font-size: 12px; font-weight: 600; margin-bottom: 24px;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 48px); font-weight: 700; letter-spacing: -1.2px;
      line-height: 1.15; margin-bottom: 16px; color: var(--text);
    }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 16px; color: var(--text-muted); max-width: 480px; margin-bottom: 32px; line-height: 1.6; }
    .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
      margin-top: 64px; width: 100%; max-width: 640px;
    }
    .stat-cell { background: var(--bg-elevated); padding: 20px 12px; text-align: center; }
    .stat-cell .val { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .stat-cell .key { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    @media (max-width: 520px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .landing-nav { padding: 16px; }
      .hero { padding: 32px 16px 60px; }
    }
    .overlay {
      position: fixed; inset: 0; background: rgba(4, 8, 14, 0.75); backdrop-filter: blur(4px);
      z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
    }
    .modal {
      background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 14px;
      width: 100%; max-width: 400px; padding: 28px; position: relative;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5); max-height: 90vh; overflow-y: auto;
    }
    .modal-lg { max-width: 520px; }
    .modal-close {
      position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border: none;
      background: transparent; color: var(--text-dim); cursor: pointer; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--bg-hover); color: var(--text); }
    .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; padding-right: 28px; }
    .modal .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-dim);
      font-weight: 600; font-size: 13px; border-radius: 4px; cursor: pointer;
    }
    .tab.active { background: var(--bg-card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-dim); }
    .form-error {
      background: rgba(232, 93, 93, 0.1); border: 1px solid rgba(232, 93, 93, 0.3);
      color: var(--danger); font-size: 12px; padding: 8px 10px; border-radius: var(--radius-sm); margin-bottom: 14px;
    }
    .form-success {
      background: rgba(62, 207, 142, 0.1); border: 1px solid rgba(62, 207, 142, 0.3);
      color: var(--success); font-size: 12px; padding: 8px 10px; border-radius: var(--radius-sm); margin-bottom: 14px;
    }
    .section-head { margin-bottom: 24px; }
    .section-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
    .section-head p { font-size: 13px; color: var(--text-muted); }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 700px) {
      .metric-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .metric {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .metric .m-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .metric .m-value {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.4px;
      line-height: 1.2;
    }
    .metric .m-value.green { color: var(--success); }
    .metric .m-value.amber { color: var(--accent); }
    .metric .m-hint { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
    .panel-head h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .panel-body { padding: 14px 16px 16px; }
    .ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .ad-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.15s;
    }
    .ad-card:hover { border-color: var(--border-strong); }
    .ad-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .ad-title { font-weight: 600; font-size: 14px; color: var(--text); }
    .ad-type {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 7px;
      border-radius: 4px; background: var(--bg); color: var(--success); border: 1px solid rgba(62, 207, 142, 0.3); white-space: nowrap;
    }
    .ad-desc { font-size: 12px; color: var(--text-muted); line-height: 1.45; flex: 1; }
    .ad-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .ad-pay { font-family: var(--mono); font-weight: 600; font-size: 14px; color: var(--success); }
    .ad-time { font-size: 11px; color: var(--text-dim); }
    .wallet-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .wallet-layout { grid-template-columns: 1fr; } }
    .method-list { display: flex; flex-direction: column; gap: 8px; }
    .method-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: border-color 0.15s;
    }
    .method-row:hover, .method-row.selected { border-color: var(--accent-dim); background: var(--accent-glow); }
    .method-row .m-icon {
      width: 36px; height: 36px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: var(--accent); flex-shrink: 0;
    }
    .method-row .m-name { font-weight: 600; font-size: 13px; }
    .method-row .m-min { font-size: 11px; color: var(--text-dim); }
    .ref-box {
      background: var(--bg); border: 1px dashed var(--border-strong); border-radius: var(--radius);
      padding: 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .ref-box input {
      flex: 1; min-width: 0; background: transparent; border: none; color: var(--text);
      font-family: var(--mono); font-size: 13px; outline: none;
    }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
    .loading-block { text-align: center; padding: 48px 20px; color: var(--text-dim); font-size: 13px; }
    .quiz-q { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .quiz-q:last-child { border-bottom: none; }
    .quiz-q .q-text { font-weight: 600; font-size: 14px; margin-bottom: 10px; color: var(--text); }
    .quiz-opt {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .quiz-opt:hover { border-color: var(--border-strong); }
    .quiz-opt.selected { border-color: var(--accent-dim); background: var(--accent-glow); }
    .quiz-opt input { margin-top: 3px; accent-color: var(--accent); }
    .toast {
      position: fixed; bottom: 24px; right: 24px; left: 24px; max-width: 360px; margin-left: auto;
      background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius);
      padding: 12px 18px; font-size: 13px; color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 300; animation: slideUp 0.25s ease;
    }
    .toast.ok { border-color: rgba(62, 207, 142, 0.4); }
    .toast.err { border-color: rgba(232, 93, 93, 0.4); }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ic { width: 18px; height: 18px; fill: currentColor; display: block; }
    .hist-item {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .hist-item:last-child { border-bottom: none; }
    .hist-amt { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
    .hist-amt.pos { color: var(--success); }
    .hist-amt.neg { color: var(--danger); }
    .overview-main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .overview-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
    @media (max-width: 900px) {
      .overview-main { grid-template-columns: 1fr; }
      .overview-bottom { grid-template-columns: 1fr; }
    }
    .panel { margin-bottom: 0; }
    .panel-head { padding: 12px 16px; }
    .panel-head h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .panel-body { padding: 14px 16px 16px; }
    .poll-opt-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; cursor: pointer; color: var(--text-muted); font-size: 13px;
    }
    .poll-opt-row:hover { color: var(--text); }
    .poll-opt-row input { accent-color: var(--accent); }
    .progress-bar {
      height: 6px; background: var(--bg); border-radius: 3px;
      overflow: hidden; margin: 12px 0 8px;
    }
    .progress-fill {
      height: 100%; background: var(--success);
      border-radius: 3px; transition: width 0.4s;
    }
    .circles-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; max-width: 140px; margin: 8px auto 12px;
    }
    .circle-slot {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px dashed var(--border-strong);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--text-dim); margin: 0 auto;
      font-family: var(--mono);
    }
    .circle-slot.filled {
      border-style: solid; border-color: var(--success);
      background: rgba(62, 207, 142, 0.08);
      color: var(--success); font-weight: 700;
    }
    .credit-row, .news-row {
      display: flex; align-items: baseline; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 12px; line-height: 1.35;
    }
    .credit-row:last-child, .news-row:last-child { border-bottom: none; padding-bottom: 0; }
    .credit-row:first-child, .news-row:first-child { padding-top: 0; }
    .credit-row .t { color: var(--text-dim); flex-shrink: 0; min-width: 52px; font-size: 11px; }
    .credit-row .body { color: var(--text-muted); min-width: 0; }
    .credit-row .body strong { color: var(--text); font-weight: 600; }
    .news-row { flex-direction: column; gap: 2px; }
    .news-row .d { font-size: 11px; color: var(--text-dim); }
    .news-row .t { color: var(--text-muted); }
    .empty { text-align: left; padding: 8px 0; color: var(--text-dim); font-size: 12px; }
    .section-head { margin-bottom: 18px; }
    .section-head h1 { font-size: 20px; }
    .section-head p { font-size: 13px; }
    .chat-fab {
      position: fixed; right: 20px; bottom: 20px; width: 48px; height: 48px; border-radius: 50%;
      background: var(--accent); color: #0a0a0a; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(240, 160, 48, 0.35); z-index: 60;
    }
    .chat-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw);
      background: var(--bg-elevated); border-left: 1px solid var(--border); z-index: 110;
      display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease;
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
    }
    .chat-drawer.open { transform: translateX(0); }
    .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg { display: flex; gap: 8px; align-items: flex-start; }
    .chat-av {
      width: 28px; height: 28px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent); flex-shrink: 0;
    }
    .chat-bubble {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 0 10px 10px 10px;
      padding: 8px 12px; font-size: 13px; color: var(--text-muted); max-width: 100%; word-break: break-word;
    }
    .chat-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
    .chat-meta strong { color: var(--text); font-weight: 600; }
    .chat-input-row { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .chat-input-row input {
      flex: 1; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); outline: none;
    }
    .chat-input-row input:focus { border-color: var(--accent-dim); }
    .rank-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rank-table th, .rank-table td { padding: 10px 12px; border: 1px solid var(--border); text-align: left; }
    .rank-table th { background: var(--bg); color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
    .rank-table tr.current td { background: var(--accent-glow); }
    .rank-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.4px; border: 1px solid var(--border-strong); color: var(--text);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const API_URL = "https://script.google.com/macros/s/AKfycbzlSlYIt5LDNA8of_CvJqHaaUesr6ntPPgquS91guXUMb8_cCNZiVSOq_sH_pODCJ9z/exec";
    const STORE_KEY = "arclight_session_v2";

    async function api(action, data = {}) {
      const params = new URLSearchParams();
      params.set("action", action);
      Object.keys(data || {}).forEach((k) => {
        const v = data[k];
        if (v === undefined || v === null) return;
        params.set(k, typeof v === "object" ? JSON.stringify(v) : String(v));
      });
      const res = await fetch(API_URL + "?" + params.toString(), { method: "GET", redirect: "follow" });
      if (!res.ok) throw new Error("Network error " + res.status);
      return res.json();
    }

    const Ic = {
      home: <svg className="ic" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>,
      ads: <svg className="ic" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM9.5 12c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5zm5 0c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5zm5 0c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5z"/></svg>,
      users: <svg className="ic" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>,
      wallet: <svg className="ic" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>,
      user: <svg className="ic" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>,
      logout: <svg className="ic" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>,
      menu: <svg className="ic" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>,
      close: <svg className="ic" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>,
      copy: <svg className="ic" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>,
      hist: <svg className="ic" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>,
      chat: <svg className="ic" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>,
      ticket: <svg className="ic" viewBox="0 0 24 24"><path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/></svg>,
      ranks: <svg className="ic" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>,
    };

    const FALLBACK_CASH_METHODS = [
      { id: "PayPal", name: "PayPal", min: 300, icon: "PP" },
      { id: "Bitcoin", name: "Bitcoin", min: 500, icon: "₿" },
      { id: "Litecoin", name: "Litecoin", min: 300, icon: "Ł" },
      { id: "Gift Card", name: "Gift Card", min: 500, icon: "GC" },
    ];

    function loadSession() {
      try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }
    function saveSession(u) { localStorage.setItem(STORE_KEY, JSON.stringify(u)); }
    function clearSession() { localStorage.removeItem(STORE_KEY); }
    function formatPts(n) { return (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 2 }); }

    function Landing({ onOpenAuth }) {
      return (
        <div className="landing">
          <nav className="landing-nav">
            <div className="brand"><div className="brand-mark">A</div>Arclight</div>
            <div className="landing-actions">
              <button className="btn btn-ghost" onClick={() => onOpenAuth("login")}>Sign in</button>
              <button className="btn btn-primary" onClick={() => onOpenAuth("register")}>Create account</button>
            </div>
          </nav>
          <div className="hero">
            <div className="hero-badge">Independent earn station</div>
            <h1>Complete offers,<br /><span>earn points.</span></h1>
            <p>Pass short quizzes on partner offers, build your balance, invite friends, and cash out when you hit the minimum.</p>
            <div className="hero-cta">
              <button className="btn btn-primary" onClick={() => onOpenAuth("register")}>Start earning free</button>
              <button className="btn btn-ghost" onClick={() => onOpenAuth("login")}>I already have an account</button>
            </div>
            <div className="stats-row">
              <div className="stat-cell"><div className="val">Live</div><div className="key">Backend</div></div>
              <div className="stat-cell"><div className="val">Quiz</div><div className="key">Offers</div></div>
              <div className="stat-cell"><div className="val">300</div><div className="key">Min cashout</div></div>
              <div className="stat-cell"><div className="val">PTS</div><div className="key">Currency</div></div>
            </div>
          </div>
        </div>
      );
    }

    function AuthModal({ mode, onClose, onAuth }) {
      const [tab, setTab] = useState(mode || "login");
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);
      const submit = async (e) => {
        e.preventDefault();
        setError("");
        if (!username.trim() || !password.trim()) { setError("Username and password are required."); return; }
        if (tab === "register" && !email.includes("@")) { setError("Enter a valid email."); return; }
        setBusy(true);
        try {
          const action = tab === "login" ? "login" : "register";
          const payload = tab === "login" ? { username: username.trim(), password } : { username: username.trim(), email: email.trim(), password };
          const res = await api(action, payload);
          if (!res.ok) { setError(res.error || "Request failed"); setBusy(false); return; }
          saveSession(res.user);
          onAuth(res.user);
        } catch (err) { setError(String(err.message || err)); }
        finally { setBusy(false); }
      };
      return (
        <div className="overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose}>{Ic.close}</button>
            <h2>{tab === "login" ? "Welcome back" : "Join Arclight"}</h2>
            <p className="sub">{tab === "login" ? "Sign in to your earn station." : "Create a free account in under a minute."}</p>
            <div className="tabs">
              <button className={`tab ${tab === "login" ? "active" : ""}`} onClick={() => { setTab("login"); setError(""); }}>Sign in</button>
              <button className={`tab ${tab === "register" ? "active" : ""}`} onClick={() => { setTab("register"); setError(""); }}>Register</button>
            </div>
            {error && <div className="form-error">{error}</div>}
            <form onSubmit={submit}>
              <div className="field"><label>Username</label><input value={username} onChange={(e) => setUsername(e.target.value)} autoFocus /></div>
              {tab === "register" && <div className="field"><label>Email</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} /></div>}
              <div className="field"><label>Password</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} /></div>
              <button type="submit" className="btn btn-primary btn-block" disabled={busy}>{busy ? "Please wait…" : tab === "login" ? "Sign in" : "Create account"}</button>
            </form>
          </div>
        </div>
      );
    }

    function QuizModal({ offer, user, onClose, onComplete, toast }) {
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [quiz, setQuiz] = useState(null);
      const [answers, setAnswers] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [result, setResult] = useState(null);
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const res = await api("getQuiz", { offer_id: offer.id, user_id: user.id });
            if (cancelled) return;
            if (!res.ok) { setError(res.error || "Could not load quiz"); setLoading(false); return; }
            setQuiz(res); setLoading(false);
          } catch (err) { if (!cancelled) { setError(String(err.message || err)); setLoading(false); } }
        })();
        return () => { cancelled = true; };
      }, [offer.id, user.id]);
      const submit = async () => {
        if (!quiz) return;
        if (quiz.questions.some((q) => answers[q.id] === undefined)) { setError("Please answer all questions."); return; }
        setError(""); setSubmitting(true);
        try {
          const res = await api("submitQuiz", { offer_id: offer.id, user_id: user.id, answers });
          if (!res.ok) { setError(res.error || "Submit failed"); setSubmitting(false); return; }
          setResult(res); onComplete(res);
          toast(res.message || (res.passed ? "Passed!" : "Failed"), res.passed ? "ok" : "err");
        } catch (err) { setError(String(err.message || err)); }
        finally { setSubmitting(false); }
      };
      return (
        <div className="overlay" onClick={onClose}>
          <div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose}>{Ic.close}</button>
            <h2>{offer.name}</h2>
            <p className="sub">{quiz ? `${quiz.offer.points} PTS · Pass ≥ ${quiz.offer.pass_percent}% · Tries left: ${quiz.offer.tries_left}` : "Loading quiz…"}</p>
            {loading && <div className="loading-block">Loading questions…</div>}
            {error && !result && <div className="form-error">{error}</div>}
            {result && (
              <div className={result.passed ? "form-success" : "form-error"}>
                <strong>{result.passed ? "Passed" : "Failed"}</strong> — {result.score_percent}% (need {result.pass_percent}%). Points: {result.points_awarded > 0 ? "+" : ""}{result.points_awarded} PTS
                <br />Balance: {formatPts(result.balance)} PTS
              </div>
            )}
            {quiz && !result && (
              <>
                {quiz.questions.map((q, i) => (
                  <div key={q.id} className="quiz-q">
                    <div className="q-text">{i + 1}. {q.question}</div>
                    {(Array.isArray(q.options) ? q.options : []).map((opt, idx) => (
                      <label key={idx} className={`quiz-opt ${answers[q.id] === idx ? "selected" : ""}`}>
                        <input type="radio" name={q.id} checked={answers[q.id] === idx} onChange={() => setAnswers((a) => ({ ...a, [q.id]: idx }))} />
                        <span>{opt}</span>
                      </label>
                    ))}
                  </div>
                ))}
                <button className="btn btn-primary btn-block" disabled={submitting} onClick={submit}>{submitting ? "Submitting…" : "Submit answers"}</button>
              </>
            )}
            {result && <button className="btn btn-primary btn-block" onClick={onClose} style={{ marginTop: 12 }}>Done</button>}
          </div>
        </div>
      );
    }

    function RedeemModal({ user, onClose, onDone, toast }) {
      const [code, setCode] = useState("");
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const submit = async () => {
        if (!code.trim()) { setMsg({ err: true, text: "Enter a code." }); return; }
        setBusy(true); setMsg(null);
        try {
          const res = await api("redeemCode", { user_id: user.id, code: code.trim() });
          if (!res.ok) setMsg({ err: true, text: res.error || "Invalid code" });
          else { setMsg({ err: false, text: res.message || ("+" + res.points + " PTS") }); setCode(""); onDone(); toast(res.message || "Code redeemed", "ok"); }
        } catch (e) { setMsg({ err: true, text: String(e.message || e) }); }
        setBusy(false);
      };
      return (
        <div className="overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose}>{Ic.close}</button>
            <h2>Redeem code</h2>
            <p className="sub">Enter a promo code to add points to your balance.</p>
            <div className="field"><label>Code</label><input value={code} onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} autoFocus /></div>
            {msg && <div className={msg.err ? "form-error" : "form-success"}>{msg.text}</div>}
            <button className="btn btn-primary btn-block" disabled={busy} onClick={submit}>{busy ? "Checking…" : "Redeem"}</button>
          </div>
        </div>
      );
    }

    function Dashboard({ user, refresh }) {
      const [poll, setPoll] = useState(null);
      const [pollSel, setPollSel] = useState(null);
      const [pollMsg, setPollMsg] = useState("");
      const [goal, setGoal] = useState(null);
      const [credits, setCredits] = useState([]);
      const [news, setNews] = useState([]);

      useEffect(() => {
        api("getPoll").then((r) => { if (r.ok) setPoll(r.poll); }).catch(() => {});
        api("getGoal", { user_id: user.id }).then((r) => { if (r.ok) setGoal(r.goal); }).catch(() => {});
        api("getCredits").then((r) => { if (r.ok) setCredits(r.credits || []); }).catch(() => {});
        api("getNews").then((r) => { if (r.ok) setNews(r.news || []); }).catch(() => {});
      }, [user.id]);

      const vote = async () => {
        if (pollSel === null || !poll) return;
        try {
          const r = await api("votePoll", { user_id: user.id, poll_id: poll.id, option_index: pollSel });
          if (r.ok) { setPollMsg("+" + (r.reward || 1) + " PTS"); refresh(); }
          else setPollMsg(r.error || "Failed");
        } catch (e) { setPollMsg(String(e.message || e)); }
      };

      const gCur = goal ? Number(goal.current) : Number(user.balance) || 0;
      const gTarget = goal ? Number(goal.target) : 300;
      const gPct = Math.min((gCur / gTarget) * 100, 100);
      const goalTitle = (goal && goal.title && !/custom usd|paypal money|rewards?1/i.test(String(goal.title)))
        ? goal.title
        : "Next withdrawal";

      return (
        <div>
          <div className="section-head">
            <h1>Overview</h1>
            <p>Your balance and station activity.</p>
          </div>

          <div className="metric-grid">
            <div className="metric">
              <div className="m-label">Available</div>
              <div className="m-value green">{formatPts(user.balance)}</div>
              <div className="m-hint">PTS</div>
            </div>
            <div className="metric">
              <div className="m-label">On hold</div>
              <div className="m-value amber">{formatPts(user.on_hold)}</div>
              <div className="m-hint">Pending</div>
            </div>
            <div className="metric">
              <div className="m-label">Lifetime</div>
              <div className="m-value">{formatPts(user.total_earned)}</div>
              <div className="m-hint">All-time</div>
            </div>
            <div className="metric">
              <div className="m-label">Rank</div>
              <div className="m-value" style={{ fontSize: 16 }}>{user.rank || "ROOKIE"}</div>
              <div className="m-hint">{user.referrals || 0} refs</div>
            </div>
          </div>

          <div className="overview-main">
            <div className="panel">
              <div className="panel-head"><h3>Daily check-in</h3></div>
              <div className="panel-body">
                {!poll && <div className="empty">No check-in available right now.</div>}
                {poll && (
                  <>
                    <p style={{ marginBottom: 8, color: "var(--text)", fontSize: 13, lineHeight: 1.4 }}>{poll.question}</p>
                    {(Array.isArray(poll.options) ? poll.options : []).map((opt, i) => (
                      <label key={i} className="poll-opt-row">
                        <input type="radio" name="poll" checked={pollSel === i} onChange={() => setPollSel(i)} />
                        {opt}
                      </label>
                    ))}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
                      <button className="btn btn-primary btn-sm" disabled={pollSel === null || !!pollMsg} onClick={vote}>
                        {pollMsg ? "Submitted" : "Submit"}
                      </button>
                      <span style={{ color: "var(--success)", fontWeight: 600, fontSize: 12 }}>+{poll.reward || 1} PTS</span>
                      {pollMsg && <span style={{ fontSize: 12, color: "var(--success)" }}>{pollMsg}</span>}
                    </div>
                  </>
                )}
              </div>
            </div>

            <div className="panel">
              <div className="panel-head"><h3>Withdrawal target</h3></div>
              <div className="panel-body">
                <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 2 }}>{goalTitle}</div>
                <div className="progress-bar"><div className="progress-fill" style={{ width: gPct + "%" }} /></div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--text-dim)" }}>
                  <span>{formatPts(gCur)} / {formatPts(gTarget)} PTS</span>
                  {goal?.earned_today != null && <span style={{ color: "var(--success)" }}>+{goal.earned_today} today</span>}
                </div>
              </div>
            </div>
          </div>

          <div className="overview-bottom">
            <div className="panel">
              <div className="panel-head"><h3>Latest earnings</h3></div>
              <div className="panel-body">
                {!credits.length && <div className="empty">No recent earnings yet.</div>}
                {credits.slice(0, 5).map((c, i) => (
                  <div key={i} className="credit-row">
                    <span className="t">{c.time}</span>
                    <span className="body"><strong>{c.partner}</strong> · {c.points} PTS · {c.username}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="panel">
              <div className="panel-head"><h3>Station updates</h3></div>
              <div className="panel-body">
                {!news.length && <div className="empty">No updates yet.</div>}
                {news.slice(0, 5).map((n, i) => (
                  <div key={n.id || i} className="news-row">
                    <div className="d">{n.date}</div>
                    <div className="t">{n.title}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SignalAds({ user, setUser, toast }) {
      const [partners, setPartners] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [activeOffer, setActiveOffer] = useState(null);
      const load = useCallback(async () => {
        setLoading(true); setError("");
        try {
          const res = await api("getPartners", { user_id: user.id });
          if (!res.ok) setError(res.error || "Failed to load offers");
          else setPartners(res.partners || []);
        } catch (err) { setError(String(err.message || err)); }
        finally { setLoading(false); }
      }, [user.id]);
      useEffect(() => { load(); }, [load]);
      const onQuizComplete = (res) => {
        if (res.balance !== undefined) {
          const next = { ...user, balance: res.balance };
          if (res.passed && res.points_awarded > 0) next.total_earned = (Number(user.total_earned) || 0) + res.points_awarded;
          setUser(next); saveSession(next);
        }
        load();
      };
      return (
        <div>
          <div className="section-head"><h1>Signal Ads</h1><p>Partner offers with quizzes. Pass for full points; fail incurs a half-point penalty.</p></div>
          {loading && <div className="loading-block">Loading offers…</div>}
          {error && <div className="form-error" style={{ marginBottom: 16 }}>{error}</div>}
          {!loading && !error && partners.length === 0 && <div className="empty">No active offers.</div>}
          <div className="ad-grid">
            {partners.map((p) => (
              <div key={p.id} className="ad-card">
                <div className="ad-card-top"><div className="ad-title">{p.name}</div><span className="ad-type">Quiz</span></div>
                <div className="ad-desc">{p.description || p.partner}</div>
                <div className="ad-meta">
                  <div><div className="ad-pay">+{p.points} PTS</div><div className="ad-time">Pass ≥ {p.pass_percent}% · {p.tries_left}/{p.max_tries} tries</div></div>
                  <button className="btn btn-primary btn-sm" disabled={p.tries_left <= 0} onClick={() => setActiveOffer(p)}>{p.tries_left <= 0 ? "No tries" : "Start"}</button>
                </div>
              </div>
            ))}
          </div>
          {activeOffer && <QuizModal offer={activeOffer} user={user} onClose={() => setActiveOffer(null)} onComplete={onQuizComplete} toast={toast} />}
        </div>
      );
    }

    function Relay({ user, toast }) {
      const link = typeof window !== "undefined" ? `${window.location.origin}${window.location.pathname}?ref=${encodeURIComponent(user.username)}` : `https://arclight.app/r/${user.username}`;
      const copy = () => { navigator.clipboard?.writeText(link).then(() => toast("Relay link copied", "ok")).catch(() => toast("Could not copy", "err")); };
      return (
        <div>
          <div className="section-head"><h1>Relay</h1><p>Invite people with your link. Referrals help raise your rank.</p></div>
          <div className="ref-box"><input readOnly value={link} /><button className="btn btn-ghost btn-sm" onClick={copy}>{Ic.copy} Copy</button></div>
          <div className="metric-grid">
            <div className="metric"><div className="m-label">Your relays</div><div className="m-value">{user.referrals || 0}</div></div>
            <div className="metric"><div className="m-label">Your rank</div><div className="m-value amber" style={{ fontSize: 18 }}>{user.rank || "ROOKIE"}</div></div>
          </div>
        </div>
      );
    }

    function Vault({ user, setUser, toast }) {
      const [methods, setMethods] = useState(FALLBACK_CASH_METHODS);
      const [method, setMethod] = useState("PayPal");
      const [amount, setAmount] = useState("");
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        api("getCashMethods").then((r) => {
          if (r.ok && r.methods && r.methods.length) {
            setMethods(r.methods);
            setMethod((cur) => r.methods.some((m) => m.id === cur) ? cur : r.methods[0].id);
          }
        }).catch(() => {});
      }, []);
      const selected = methods.find((m) => m.id === method) || methods[0] || FALLBACK_CASH_METHODS[0];
      const request = async () => {
        const pts = parseFloat(amount);
        if (!pts || pts <= 0) { toast("Enter a valid amount in PTS", "err"); return; }
        if (pts < selected.min) { toast(`Minimum for ${selected.name} is ${selected.min} PTS`, "err"); return; }
        if (pts > Number(user.balance)) { toast("Insufficient available balance", "err"); return; }
        setBusy(true);
        try {
          const res = await api("requestCashout", { user_id: user.id, points: pts, method: selected.id, details: "" });
          if (!res.ok) toast(res.error || "Cashout failed", "err");
          else {
            const next = { ...user, balance: Number(user.balance) - pts, on_hold: (Number(user.on_hold) || 0) + pts };
            setUser(next); saveSession(next); setAmount(""); toast(res.message || "Cashout requested", "ok");
          }
        } catch (err) { toast(String(err.message || err), "err"); }
        finally { setBusy(false); }
      };
      return (
        <div>
          <div className="section-head"><h1>Vault</h1><p>Available balance and payout methods. Minimum cashout: 300 PTS.</p></div>
          <div className="metric-grid">
            <div className="metric"><div className="m-label">Available</div><div className="m-value green">{formatPts(user.balance)} PTS</div></div>
            <div className="metric"><div className="m-label">On hold</div><div className="m-value amber">{formatPts(user.on_hold)} PTS</div></div>
          </div>
          <div className="wallet-layout">
            <div className="panel"><div className="panel-head"><h3>Payout method</h3></div><div className="panel-body">
              <div className="method-list">
                {methods.map((m) => (
                  <div key={m.id} className={`method-row ${method === m.id ? "selected" : ""}`} onClick={() => setMethod(m.id)}>
                    <div className="m-icon">{m.icon}</div>
                    <div><div className="m-name">{m.name}</div><div className="m-min">Min {m.min} PTS</div></div>
                  </div>
                ))}
              </div>
            </div></div>
            <div className="panel"><div className="panel-head"><h3>Request payout</h3></div><div className="panel-body">
              <div className="field"><label>Amount (PTS)</label><input type="number" step="1" min="0" placeholder="300" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
              <p style={{ fontSize: 12, color: "var(--text-dim)", marginBottom: 14 }}>Selected: <strong style={{ color: "var(--text)" }}>{selected.name}</strong> · Min {selected.min} PTS</p>
              <button className="btn btn-primary btn-block" onClick={request} disabled={busy}>{busy ? "Submitting…" : "Submit request"}</button>
            </div></div>
          </div>
        </div>
      );
    }

    function History({ user }) {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const res = await api("getHistory", { user_id: user.id });
            if (cancelled) return;
            if (!res.ok) setError(res.error || "Failed");
            else setItems(res.history || []);
          } catch (err) { if (!cancelled) setError(String(err.message || err)); }
          finally { if (!cancelled) setLoading(false); }
        })();
        return () => { cancelled = true; };
      }, [user.id]);
      return (
        <div>
          <div className="section-head"><h1>History</h1><p>Recent transactions.</p></div>
          <div className="panel"><div className="panel-body">
            {loading && <div className="loading-block">Loading…</div>}
            {error && <div className="form-error">{error}</div>}
            {!loading && !error && items.length === 0 && <div className="empty">No transactions yet.</div>}
            {items.map((t) => (
              <div key={t.id} className="hist-item">
                <div>
                  <div style={{ color: "var(--text)", fontWeight: 500 }}>{t.description || t.type}</div>
                  <div style={{ fontSize: 11, color: "var(--text-dim)", marginTop: 2 }}>{t.created_at ? new Date(t.created_at).toLocaleString() : ""} · {t.type}</div>
                </div>
                <div className={`hist-amt ${Number(t.amount) >= 0 ? "pos" : "neg"}`}>{Number(t.amount) >= 0 ? "+" : ""}{formatPts(t.amount)}</div>
              </div>
            ))}
          </div></div>
        </div>
      );
    }

    function Ranks({ user }) {
      const [ranks, setRanks] = useState([]);
      useEffect(() => { api("getRanks").then((r) => { if (r.ok) setRanks(r.ranks || []); }).catch(() => {}); }, []);
      return (
        <div>
          <div className="section-head"><h1>Ranks</h1><p>Meet either earnings or referrals requirement. Current: <strong>{user.rank || "ROOKIE"}</strong></p></div>
          <div className="panel" style={{ overflowX: "auto" }}>
            <table className="rank-table">
              <thead><tr><th>Rank</th><th>Earnings</th><th>Referrals</th><th>Rewards</th><th>Perks</th></tr></thead>
              <tbody>
                {ranks.map((r) => (
                  <tr key={r.rank} className={r.rank === user.rank ? "current" : ""}>
                    <td><span className="rank-badge">{r.rank}</span></td>
                    <td>{formatPts(r.earnings)}</td>
                    <td>{r.referrals}</td>
                    <td>{r.rewards}</td>
                    <td>{(r.perks || []).join(", ") || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function Profile({ user, onLogout, setUser, toast }) {
      const [email, setEmail] = useState(user.email || "");
      const [password, setPassword] = useState("");
      const [busy, setBusy] = useState(false);
      const [newName, setNewName] = useState("");
      const [nameStep, setNameStep] = useState(null);
      const [nameBusy, setNameBusy] = useState(false);
      const COST = 250;
      const save = async () => {
        setBusy(true);
        try {
          const payload = { user_id: user.id };
          if (email && email !== user.email) payload.email = email;
          if (password) payload.password = password;
          if (!payload.email && !payload.password) { toast("Nothing to update", "err"); setBusy(false); return; }
          const res = await api("updateAccount", payload);
          if (!res.ok) toast(res.error || "Update failed", "err");
          else { if (res.user) { setUser(res.user); saveSession(res.user); } setPassword(""); toast(res.message || "Account updated", "ok"); }
        } catch (err) { toast(String(err.message || err), "err"); }
        finally { setBusy(false); }
      };
      const changeName = async () => {
        setNameBusy(true);
        try {
          const res = await api("changeUsername", { user_id: user.id, new_username: newName.trim(), confirm: true });
          if (!res.ok) toast(res.error || "Failed", "err");
          else {
            const next = { ...user, username: res.username, balance: res.balance != null ? res.balance : user.balance };
            setUser(next); saveSession(next); setNameStep(null); setNewName(""); toast(res.message || "Username changed", "ok");
          }
        } catch (e) { toast(String(e.message || e), "err"); }
        setNameBusy(false);
      };
      return (
        <div>
          <div className="section-head"><h1>Profile</h1><p>Account details and settings.</p></div>
          <div className="panel"><div className="panel-body">
            <div style={{ display: "grid", gap: 16, maxWidth: 400 }}>
              <div><div style={{ fontSize: 11, color: "var(--text-dim)", textTransform: "uppercase", letterSpacing: "0.4px" }}>Username</div><div style={{ fontFamily: "var(--mono)", fontWeight: 600 }}>{user.username}</div></div>
              <div><div style={{ fontSize: 11, color: "var(--text-dim)", textTransform: "uppercase", letterSpacing: "0.4px" }}>Rank</div><div>{user.rank || "ROOKIE"}</div></div>
              <div><div style={{ fontSize: 11, color: "var(--text-dim)", textTransform: "uppercase", letterSpacing: "0.4px" }}>Member since</div><div>{user.created_at ? new Date(user.created_at).toLocaleDateString() : "—"}</div></div>
              <div className="field" style={{ marginBottom: 0 }}><label>Email</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} /></div>
              <div className="field" style={{ marginBottom: 0 }}><label>New password (optional)</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Leave blank to keep" /></div>
              <button className="btn btn-primary" onClick={save} disabled={busy}>{busy ? "Saving…" : "Save changes"}</button>
              <button className="btn btn-ghost" onClick={() => setNameStep("input")}>Change username ({COST} PTS)</button>
            </div>
            <div style={{ marginTop: 28 }}><button className="btn btn-danger" onClick={onLogout}>{Ic.logout} Sign out</button></div>
          </div></div>
          {nameStep && (
            <div className="overlay" onClick={() => setNameStep(null)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close" onClick={() => setNameStep(null)}>{Ic.close}</button>
                <h2>Change username</h2>
                <p className="sub">Costs {COST} PTS. Cannot be undone.</p>
                {nameStep === "input" && (
                  <>
                    <div className="field"><label>New username</label><input value={newName} onChange={(e) => setNewName(e.target.value)} autoFocus /></div>
                    <button className="btn btn-primary btn-block" onClick={() => {
                      const n = newName.trim();
                      if (n.length < 3 || n.length > 20) { toast("3–20 characters", "err"); return; }
                      if (!/^[a-zA-Z0-9_]+$/.test(n)) { toast("Letters, numbers, underscores only", "err"); return; }
                      setNameStep("confirm");
                    }}>Continue</button>
                  </>
                )}
                {nameStep === "confirm" && (
                  <>
                    <p style={{ marginBottom: 16 }}>Change to <strong>{newName.trim()}</strong> for {COST} PTS?</p>
                    <button className="btn btn-primary btn-block" disabled={nameBusy} onClick={changeName}>{nameBusy ? "Working…" : "Yes, change username"}</button>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function ChatDrawer({ open, onClose, user }) {
      const [msgs, setMsgs] = useState([]);
      const [input, setInput] = useState("");
      const bottomRef = useRef(null);
      const load = () => { api("getChat", { limit: 50 }).then((r) => { if (r.ok) setMsgs(r.messages || []); }).catch(() => {}); };
      useEffect(() => { if (open) load(); }, [open]);
      useEffect(() => { if (open && bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth" }); }, [open, msgs]);
      const send = async () => {
        if (!input.trim()) return;
        const text = input.trim(); setInput("");
        try { const r = await api("sendChat", { user_id: user.id, message: text }); if (r.ok) load(); } catch (e) {}
      };
      return (
        <div className={`chat-drawer ${open ? "open" : ""}`}>
          <div className="chat-head"><strong>Chat</strong><button className="btn btn-ghost btn-sm" onClick={onClose}>{Ic.close}</button></div>
          <div className="chat-msgs">
            {msgs.map((m) => (
              <div key={m.id} className="chat-msg">
                <div className="chat-av">{(m.username || "?").charAt(0).toUpperCase()}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="chat-meta"><strong>{m.username}</strong>{m.badge ? ` · ${m.badge}` : ""} · {m.time}</div>
                  <div className="chat-bubble">{m.deleted ? <em style={{ color: "var(--danger)" }}>Message deleted</em> : m.message}</div>
                </div>
              </div>
            ))}
            <div ref={bottomRef} />
          </div>
          <div className="chat-input-row">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Type a message…" />
            <button className="btn btn-primary btn-sm" onClick={send}>Send</button>
          </div>
        </div>
      );
    }

    function AppShell({ user, setUser, onLogout, toast }) {
      const [page, setPage] = useState("home");
      const [railOpen, setRailOpen] = useState(false);
      const [chatOpen, setChatOpen] = useState(false);
      const [codeOpen, setCodeOpen] = useState(false);
      const nav = [
        { id: "home", label: "Overview", icon: Ic.home },
        { id: "ads", label: "Signal Ads", icon: Ic.ads },
        { id: "relay", label: "Relay", icon: Ic.users },
        { id: "vault", label: "Vault", icon: Ic.wallet },
        { id: "history", label: "History", icon: Ic.hist },
        { id: "ranks", label: "Ranks", icon: Ic.ranks },
        { id: "profile", label: "Profile", icon: Ic.user },
      ];
      const titles = { home: "Overview", ads: "Signal Ads", relay: "Relay", vault: "Vault", history: "History", ranks: "Ranks", profile: "Profile" };
      const go = (id) => { setPage(id); setRailOpen(false); };
      const refresh = async () => {
        try {
          const r = await api("getUser", { user_id: user.id });
          if (r.ok && r.user) { setUser(r.user); saveSession(r.user); }
        } catch (e) {}
      };
      return (
        <div className="shell">
          <aside className={`rail ${railOpen ? "mobile-open" : ""}`}>
            <div className="rail-logo">A</div>
            {nav.map((n) => (
              <button key={n.id} className={`rail-btn ${page === n.id ? "active" : ""}`} title={n.label} onClick={() => go(n.id)}>
                {n.icon}<span className="rail-label">{n.label}</span>
              </button>
            ))}
            <button className="rail-btn" title="Redeem code" onClick={() => { setCodeOpen(true); setRailOpen(false); }}>
              {Ic.ticket}<span className="rail-label">Redeem code</span>
            </button>
            <div className="rail-spacer" />
            <button className="rail-btn" title="Sign out" onClick={onLogout}>{Ic.logout}<span className="rail-label">Sign out</span></button>
          </aside>
          <div className="main-col">
            <header className="topbar">
              <div className="topbar-left">
                <div className="mobile-bar"><button className="mobile-menu-btn" onClick={() => setRailOpen((o) => !o)} aria-label="Menu">{Ic.menu}</button></div>
                <span className="page-label">{titles[page]}</span>
              </div>
              <div className="topbar-right">
                <div className="balance-chip hold"><span className="dot" /><span className="amt">{formatPts(user.on_hold)}</span><span className="lbl">hold</span></div>
                <div className="balance-chip"><span className="dot" /><span className="amt">{formatPts(user.balance)}</span><span className="lbl">PTS</span></div>
                <button className="avatar-btn" onClick={() => go("profile")} title={user.username}>{(user.username || "??").slice(0, 2).toUpperCase()}</button>
              </div>
            </header>
            <main className="content">
              {page === "home" && <Dashboard user={user} refresh={refresh} />}
              {page === "ads" && <SignalAds user={user} setUser={setUser} toast={toast} />}
              {page === "relay" && <Relay user={user} toast={toast} />}
              {page === "vault" && <Vault user={user} setUser={setUser} toast={toast} />}
              {page === "history" && <History user={user} />}
              {page === "ranks" && <Ranks user={user} />}
              {page === "profile" && <Profile user={user} onLogout={onLogout} setUser={setUser} toast={toast} />}
            </main>
          </div>
          {railOpen && <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 90 }} onClick={() => setRailOpen(false)} />}
          <button className="chat-fab" onClick={() => setChatOpen(true)} title="Chat">{Ic.chat}</button>
          <ChatDrawer open={chatOpen} onClose={() => setChatOpen(false)} user={user} />
          {chatOpen && <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 105 }} onClick={() => setChatOpen(false)} />}
          {codeOpen && <RedeemModal user={user} onClose={() => setCodeOpen(false)} onDone={refresh} toast={toast} />}
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [booting, setBooting] = useState(true);
      const [authOpen, setAuthOpen] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const toastTimer = useRef(null);
      useEffect(() => {
        (async () => {
          const s = loadSession();
          if (s && s.id) {
            try {
              const res = await api("getUser", { user_id: s.id });
              if (res.ok && res.user) { setUser(res.user); saveSession(res.user); }
              else clearSession();
            } catch { setUser(s); }
          }
          setBooting(false);
        })();
      }, []);
      const toast = (text, type = "ok") => {
        if (toastTimer.current) clearTimeout(toastTimer.current);
        setToastMsg({ text, type });
        toastTimer.current = setTimeout(() => setToastMsg(null), 3200);
      };
      const logout = () => { clearSession(); setUser(null); setAuthOpen(null); };
      if (booting) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-dim)" }}>Loading Arclight…</div>;
      if (!user) {
        return (
          <>
            <Landing onOpenAuth={setAuthOpen} />
            {authOpen && <AuthModal mode={authOpen} onClose={() => setAuthOpen(null)} onAuth={(u) => { setUser(u); setAuthOpen(null); }} />}
          </>
        );
      }
      return (
        <>
          <AppShell user={user} setUser={setUser} onLogout={logout} toast={toast} />
          {toastMsg && <div className={`toast ${toastMsg.type}`}>{toastMsg.text}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
